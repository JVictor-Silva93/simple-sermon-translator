[project]
name = "simple-sermon-translator"
version = "0.1.0"
description = "Simple open source live sermon translator."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "engine",
    "app",
]

[tool.pytest.ini_options]
testpaths = [
    "engine/tests",
    "app/tests",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]
