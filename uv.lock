version = 1
revision = 3
requires-python = "==3.12.*"

[manifest]
members = [
    "sermon-app",
    "sermon-engine",
    "simple-sermon-translator",
]

[[package]]
name = "sermon-app"
version = "0.1.0"
source = { editable = "app" }
dependencies = [
    { name = "sermon-engine" },
]

[package.metadata]
requires-dist = [{ name = "sermon-engine", editable = "engine" }]

[[package]]
name = "sermon-engine"
version = "0.1.0"
source = { editable = "engine" }

[[package]]
name = "simple-sermon-translator"
version = "0.1.0"
source = { virtual = "." }
